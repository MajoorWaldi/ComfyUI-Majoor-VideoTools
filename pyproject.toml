[project]
name = "majoor-videotools"
version = "0.1.0"
description = "Cut a video into identified shots, regenerate any shot with any workflow, rebuild the video without touching the source; with ready workflows for automatic edits (remix, creative text, creative music) on local models."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["scenedetect>=0.7", "filelock", "numpy", "Pillow", "opencv-python"]

[tool.comfy]
DisplayName = "Majoor VideoTools"
requires-comfyui = ">=0.41.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
