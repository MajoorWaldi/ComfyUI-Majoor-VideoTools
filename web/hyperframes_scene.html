<template>
<style>
#root{position:absolute;inset:0;pointer-events:none;color:#f5edde;font-family:Inter,sans-serif;--accent:__ACCENT__}
.serif-font{font-family:'Playfair Display',serif}
.title{position:absolute;inset:0;z-index:3}.panel{position:absolute;left:11%;top:12%;width:78%;padding:3% 0;background:linear-gradient(90deg,rgba(0,0,0,.86),rgba(0,0,0,.5),transparent)}.bottom .panel{top:auto;bottom:23%}.words{font-family:Oswald,sans-serif;font-size:clamp(18px,7vw,82px);line-height:1.15;overflow-wrap:anywhere}.words span{display:inline-block;white-space:pre}.rule{width:22%;height:2px;background:var(--accent);margin-top:4%;transform-origin:left}
#graphics{position:absolute;inset:0;z-index:2}#orbit{position:absolute;inset:25% 5%;width:90%;height:50%;opacity:.25}#ring{transform-origin:300px 300px}#corners{position:absolute;inset:0;width:100%;height:100%;opacity:.25}.marks{fill:none;stroke:var(--accent);stroke-width:2}#bars{position:absolute;bottom:15%;left:12%;height:3%;display:flex;gap:4px;align-items:flex-end;opacity:.7}.bar{width:4px;height:100%;background:var(--accent);transform-origin:bottom}
</style>
<div id="root" data-composition-id="motion" data-width="__WIDTH__" data-height="__HEIGHT__">
<div id="graphics" class="clip" data-start="0" data-duration="__DURATION__" data-track-index="0"><svg id="orbit" viewBox="0 0 600 600" data-layout-ignore="true"><g id="ring" fill="none" stroke="__ACCENT__"><circle cx="300" cy="300" r="285" stroke-dasharray="80 180 15 300 55 1160"/><circle cx="300" cy="300" r="264" stroke-dasharray="4 410"/></g></svg><svg id="corners" viewBox="0 0 608 1056" preserveAspectRatio="none" data-layout-ignore="true"><path class="marks" d="M35 250V220H65 M543 220H573V250 M35 762V792H65 M543 792H573V762"/></svg><div id="bars" data-layout-ignore="true"><i class="bar" id="b0"></i><i class="bar" id="b1"></i><i class="bar" id="b2"></i><i class="bar" id="b3"></i><i class="bar" id="b4"></i><i class="bar" id="b5"></i><i class="bar" id="b6"></i></div></div>
<canvas id="layerCanvas" width="__WIDTH__" height="__HEIGHT__" style="position:absolute;inset:0;width:100%;height:100%;z-index:1" data-layout-ignore="true"></canvas>
__CARDS__
</div>
<script>
const config=__CONFIG__;
window.__majoorLayers.attach(config);

const tl=gsap.timeline({paused:true});
const amplitude=config.intensity;
tl.fromTo('#graphics',{opacity:0},{opacity:amplitude,duration:.3},0);
tl.fromTo('#ring',{rotation:-30},{rotation:70,duration:config.duration,ease:'none'},0);
if(config.preset==='minimal'){gsap.set('#orbit',{opacity:0});gsap.set('#bars',{opacity:0});}
config.cues.forEach((cue,i)=>{
const d=Math.min(.32,(cue.end-cue.start)/3), energetic=config.preset==='energetic';
tl.fromTo('#title'+i+' .panel',{opacity:0},{opacity:1,duration:d},cue.start);
tl.fromTo('#title'+i+' .words span',{y:energetic?35:12,opacity:0},{y:0,opacity:1,duration:d,ease:'power3.out',stagger:Math.min(.02,(cue.end-cue.start)/Math.max(cue.text.length*5,1))},cue.start);
tl.fromTo('#title'+i+' .rule',{scaleX:0},{scaleX:1,duration:d,ease:'power3.out'},cue.start);
tl.to('#title'+i+' .panel',{opacity:0,duration:d},cue.end-d);
});
config.audio.bands.forEach((row,i)=>{row.forEach((v,b)=>tl.set('#b'+b,{scaleY:.12+.88*v},i/config.fps));});
config.audio.hits.forEach(at=>tl.fromTo('#corners',{opacity:.9},{opacity:.18,duration:.22,immediateRender:false,ease:'power2.out'},at));
tl.to('#graphics',{opacity:0,duration:Math.min(.3,config.duration/4)},Math.max(0,config.duration-.3));
window.__timelines=window.__timelines||{};window.__timelines.motion=tl;
</script>
</template>
